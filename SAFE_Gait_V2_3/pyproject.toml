[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-gait-v2-3"
version = "2.3.0"
description = "Reliable cross-condition one-shot personalization via coherent hierarchical residual decomposition"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "torch>=2.1", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["safe_gait*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
