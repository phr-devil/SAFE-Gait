[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apace-v6"
version = "0.1.0"
description = "Counterfactual active calibration planning for plantar-pressure sensing"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "torch>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["apace*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
